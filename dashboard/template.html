<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Купон Лаб</title>
<!--
  Купон Лаб dashboard -- rebuild of bond-lab-design-reference.html (Claude
  Design export; the reference file is kept untracked in the primary checkout).
  Source layout:
    src/design-system.css  verbatim design tokens + component classes
    src/base.css           verbatim page-level rules from the reference
    src/app.css            shell + page layout transcribed from the reference
    src/core.js            DATA, formatting helpers, tiny DOM helpers
    src/bonds.js           the bond model every page reads (real data only)
    src/app.js             header readouts, page router, detail drawer
    src/pages/*.js         one file per page (rates.js -- Ставка и ОФЗ -- is
                           the one page beyond the reference)
  D3 is the one external script (the market map); everything else, data
  included, is inlined. Without it the map says so and the screener still
  works -- see TerminalMap.mount().
  scripts/build_dashboard.py inlines every INCLUDE marker and embeds
  data/dashboard_data.json, emitting one self-contained dashboard/index.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>/*__INCLUDE:src/design-system.css__*/</style>
<style>/*__INCLUDE:src/base.css__*/</style>
<style>/*__INCLUDE:src/app.css__*/</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">К</div>
      <div class="brand-name">Купон Лаб</div>
      <div class="brand-sub">терминал</div>
    </div>

    <nav class="topnav" id="topnav">
      <button type="button" class="topnav-btn" data-page="overview">Обзор</button>
      <button type="button" class="topnav-btn" data-page="terminal">Карта и скринер</button>
      <button type="button" class="topnav-btn" data-page="rates">Ставка и ОФЗ</button>
      <button type="button" class="topnav-btn" data-page="portfolio">Портфель</button>
      <button type="button" class="topnav-btn" data-page="data">Данные</button>
    </nav>

    <div class="topbar-spacer"></div>

    <div class="topbar-readouts">
      <button type="button" class="readout readout-link" id="cbrChip" data-page="rates">
        <span class="readout-kicker">Ключевая ЦБ</span>
        <span class="readout-value" id="cbrRate">—</span>
        <span class="readout-next" id="cbrNext"></span>
      </button>
      <button type="button" class="readout readout-health" id="healthChip" data-page="data">
        <span class="health-dot" id="healthDot"></span>
        <span id="healthLabel">—</span>
      </button>
    </div>
  </header>

  <main>
    <section class="page" id="page-overview" hidden></section>
    <section class="page" id="page-terminal" hidden></section>
    <section class="page" id="page-rates" hidden></section>
    <section class="page" id="page-portfolio" hidden></section>
    <section class="page" id="page-data" hidden></section>
  </main>

  <div id="detail" hidden>
    <div class="detail-backdrop" data-close-detail></div>
    <aside class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div class="detail-head-text">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-sub" id="detailSub"></div>
        </div>
        <button type="button" class="detail-close" data-close-detail aria-label="Закрыть">×</button>
      </div>
      <div id="detailBody"></div>
    </aside>
  </div>

</div>

<script id="dashboard-data" type="application/json">/*__DASHBOARD_DATA__*/</script>
<script>/*__INCLUDE:src/core.js__*/</script>
<script>/*__INCLUDE:src/bonds.js__*/</script>
<script>/*__INCLUDE:src/pages/overview.js__*/</script>
<!-- Обзор "Рынок сегодня" band: an addition beyond the design reference; delete this line and the file to remove it. -->
<script>/*__INCLUDE:src/pages/overview-market-band.js__*/</script>
<script>/*__INCLUDE:src/pages/terminal-map.js__*/</script>
<script>/*__INCLUDE:src/pages/bond-detail.js__*/</script>
<script>/*__INCLUDE:src/pages/terminal.js__*/</script>
<!-- Ставка и ОФЗ: a fifth page beyond the design reference, built only from the reference's own components (plan rev 2, 2026-09-17). -->
<script>/*__INCLUDE:src/pages/rates.js__*/</script>
<script>/*__INCLUDE:src/pages/portfolio.js__*/</script>
<script>/*__INCLUDE:src/pages/data.js__*/</script>
<script>/*__INCLUDE:src/app.js__*/</script>
</body>
</html>
