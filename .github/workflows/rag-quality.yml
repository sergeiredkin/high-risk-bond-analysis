name: HyBond RAG quality

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    paths:
      - 'src/hybond/rag/**'
      - 'src/hybond/__main__.py'
      - 'src/hybond/store/db.py'
      - 'scripts/rag_server.py'
      - 'tests/test_rag_*.py'
      - 'dashboard/rag.html'
      - 'docs/rag/**'
      - '.github/workflows/rag-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pytest ruff requests
      - name: Lint RAG implementation
        run: ruff check src/hybond/rag scripts/rag_server.py tests/test_rag_*.py
      - name: Compile RAG implementation
        run: python -m compileall -q src/hybond/rag scripts/rag_server.py
      - name: Run test suite
        run: PYTHONPATH=src python -m pytest -q
